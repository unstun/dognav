claim_boundary: >-
  These official regional product images corroborate the visible architecture
  of the current Lite3 LiDAR upper assembly: the front sensor carrier and rear
  Interface enclosure are independently supported on the robot top by discrete
  local supports. They do not publish the hidden robot-side receiver geometry,
  screw thread, engagement depth, tolerances, or factory CAD. The visible
  replica track therefore omits hidden receivers entirely; a later printable
  attachment, if requested, must be a separately labeled adaptation.
