excluded_leads:
  - id: cn219419372u
    url: "https://patents.google.com/patent/CN219419372U/zh"
    reason: >-
      The assignee patent contains detailed line drawings of a quadruped-robot
      battery locking structure, but it does not identify Lite3 and provides no
      dimensions suitable for reconstructing the Lite3 payload interface.
  - id: cn116526110a
    url: "https://patents.google.com/patent/CN116526110A/zh"
    reason: >-
      The assignee patent contains antenna-mount construction drawings but no
      Lite3 model identification or reusable Lite3 body dimensions.
  - id: cn116787395a
    url: "https://patents.google.com/patent/CN116787395A/zh"
    reason: >-
      The assignee patent describes a quadruped-compatible arm, but its base is
      not dimensioned and the document does not establish a Lite3 hole pattern.

open_requirements_before_fabrication:
  - "Confirm the physical robot variant and revision from its product label."
  - "Measure thread engagement depth for the selected M3 or M4 holes."
  - "Confirm hole-centre distances on the physical robot with calipers."
  - "Establish a physical datum and the payload-clearance envelope."
