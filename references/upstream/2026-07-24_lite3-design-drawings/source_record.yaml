topic: lite3_dimensioned_design_drawings
surveyed_at: "2026-07-24"
claim_boundary: >-
  These manuals provide dimensioned external geometry and payload mounting-hole
  layouts. They are sufficient to seed a reference model or adapter-plate
  drawing, but they are not manufacturing drawings: tolerances, thread depth,
  material, wall thickness, surface finish, and a complete datum scheme are not
  specified.

