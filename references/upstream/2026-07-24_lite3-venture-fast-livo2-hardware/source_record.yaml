    - ".trellis/tasks/07-23-scan-planner-reproduction/evidence/lite3-venture-bz20-real-holes-fusion-2026-07-24.png"
  claim_boundary: >-
    This inspection proves that the unchanged BZ20 STEP contains a closed BRep
    solid with modeled cylindrical surfaces rather than painted-on fastener
    details. It is a partial Lite3 Venture backload-shell component, not a
    complete Lite3 chassis or a validated Lite3 Pro payload interface. The
    inspection does not establish helical thread geometry, fit, load capacity,
    manufacturability, or safe real-robot installation.
