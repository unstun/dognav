sensor_assembly_geometry:
  j17a:
    freecad_solid_count: 1
    freecad_bbox_mm: [153.734544, 115.000000, 27.061439]
    camera_mount_axis_source_frame: [0.939693, 0.000000, -0.342020]
    camera_mount_axis_angle_deg: 20.0
    note: >-
      The J17A is the larger sensor carrier visible in the official hardware
      installation video. It surrounds the J20A/Mid-360 subassembly and
      provides the two-hole angled D435i mounting face.
  j20a:
    freecad_solid_count: 1
    freecad_bbox_mm: [96.000000, 26.087040, 80.000000]
    drawing_angle_deg: 15.0
    mounting_plane_normal_source_frame: [0.258819, 0.965926, 0.0]
    note: >-
      The large Mid-360 mounting plane therefore tilts its normal 15 degrees
      from source +Y toward source +X.
  s410:
    freecad_solid_count: 1
    freecad_brep_bbox_mm: [105.000000, 74.332019, 105.000000]
    tessellated_exterior_bbox_mm: [93.510849, 73.989998, 69.459248]
    note: >-
      The raw BRep bound includes internal construction/reference geometry.
      The tessellated closed solid exterior and the official drawing give the
      smaller physical guard envelope used by the printable assembly.
  claim_boundary: >-
    These files are officially linked Lite3 Venture FAST-LIVO2 extension
    components. J17A, J20A and S410 constrain the printable replica's real
    sensor carrier, 15-degree Mid-360 orientation and 20-degree D435i mounting
    face, but are not relabeled as the factory Lite3 LiDAR V1.0.7 assembly.

