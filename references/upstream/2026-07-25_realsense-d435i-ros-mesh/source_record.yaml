  source_axes: >-
    Source X is camera width, source Y is camera height, and source +Z points
    from the rear enclosure toward the front optical plate. This follows the
    transform used by the pinned official _d435.urdf.xacro.

provenance_note: >-
  The pinned official _d435i.urdf.xacro includes _d435.urdf.xacro, and the
  latter uses meshes/d435.dae for the aluminum peripheral camera case. The
  D435i visual exterior in this project therefore uses this official ROS mesh
  directly. It is not presented as a conversion of the separately preserved
  proprietary D435i_Solid.SLDPRT.

claim_boundary: >-
  This is the official RealSense ROS visual mesh used for D435i robot
  description, not manufacturing CAD. The exact source mesh is retained for
  the visual track. A separately reported voxel reconstruction is required
  for a closed printable solid.
