decision:
  use_as_official_lite3_geometry: false
  reasons:
    - The model is a third-party MakerWorld design, not DEEP Robotics CAD.
    - Its 30-degree Mid-360 tilt differs from the official J20A 15-degree plate.
    - Its 45 x 80 mm robot pattern differs from the Lite3 Pro 74 x 94 mm pattern.
    - Its eight sensor-fastener arrangement does not match the official J17A
      video evidence for direct two-M3 D435 attachment.
  permitted_use: >-
    Secondary comparison reference only. It may inform a future explicitly
    nonofficial print adaptation after the user's real industrial-PC geometry
    is supplied, but it must not be presented as a Lite3 factory replica.

