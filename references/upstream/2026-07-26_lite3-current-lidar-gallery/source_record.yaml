inspection:
  result: >-
    The official-shop LiDAR image and the dealer gallery primarily show the
    legacy cylindrical-LiDAR configuration. They do not expose a manufacturing
    drawing for a Mid-360 carrier. Dealer text permits either Livox or Leishen
    hardware and therefore cannot establish one exact mechanical revision.

claim_boundary: >-
  These retail images are useful for separating historical product revisions,
  but they do not define the requested V1.0.7 official-LiDAR assembly. The
  V1.0.7 LiDAR manual is the target-identity source. The separate FAST-LIVO2
  video and published J17A/J20A/S410 files are related component candidates
  only and do not prove factory V1.0.7 carrier or Interface geometry.
