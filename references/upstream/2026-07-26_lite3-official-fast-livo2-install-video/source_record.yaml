claim_boundary: >-
  This official installation video proves the assembly relationship of the
  published Lite3 Venture FAST-LIVO2 Mid-360 extension. It proves direct D435
  attachment to J17A, identifies the adjacent BZ20/rear-AGX relationship, and
  rejects the previously invented rail/yoke mechanism. The exact BZ20 rigid
  transform must still be estimated from the video because no complete
  assembly STEP is public. The video does not prove that J17A is the
  regulatory factory cylindrical-LiDAR bracket, that its original robot-side
  hole pattern fits Lite3 Pro without adaptation, or that the user's different
  industrial PC shares the AGX geometry.
