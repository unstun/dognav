Review like an academic project maintainer.
Read the requested artifact plus `3_paper/references.bib`, `.pipeline/experiments/`, `.pipeline/contracts/`, `.pipeline/terminology/terminology.md`, and `bigmemory/热区/状态简报.md` when relevant.
